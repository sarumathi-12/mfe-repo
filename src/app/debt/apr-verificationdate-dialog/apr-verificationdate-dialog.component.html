<h2 mat-dialog-title>Add APR Verification Date</h2>
<h3 mat-dialog-title>Enter details below to add verification date</h3>

<mat-dialog-content>
  <form [formGroup]="verificationForm">
    <label class="field-label">Verification Date <span class="required-star">*</span></label>
    <mat-form-field appearance="outline" class="full-width">
      <input matInput 
             [matDatepicker]="picker" 
             formControlName="verificationDate"
             [max]="maxDate"
             placeholder="Select verification date"
             required />
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error *ngIf="verificationForm.get('verificationDate')?.invalid">
        Please select a date
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="verificationForm.invalid">Save</button>
</mat-dialog-actions>
